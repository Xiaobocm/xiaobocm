<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf6">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Offline — Jason Xi</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
    background: #fbfaf6; color: #162126; font-family: Georgia, 'Times New Roman', serif; }
  @media (prefers-color-scheme: dark) { body { background: #0d151a; color: #dfe9ed; } }
  .card { width: min(100%, 560px); border: 1px solid currentColor; padding: 40px; opacity: .9; }
  .eyebrow { margin: 0 0 22px; font: 11px/1.4 Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  h1 { margin: 0 0 16px; font-size: clamp(2.4rem, 8vw, 4.2rem); font-weight: 300; line-height: 1; }
  p { max-width: 390px; margin: 0 0 26px; font-size: 17px; line-height: 1.65; opacity: .7; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">signal lost / offline</p>
    <h1>you’re offline.</h1>
    <p>the page will be here when the connection comes back. the sea is patient.</p>
    <a href="/">try again</a>
  </div>
</body>
</html>
