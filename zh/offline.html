<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem('xb-theme');if(t!=='light'&&t!=='dark'){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbfaf6">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>離線 — Jason Xi</title>
<style>
  :root { color-scheme: light dark; }
  html[data-theme="light"] { --bg:#fbfaf6; --fg:#162126; }
  html[data-theme="dark"] { --bg:#0d151a; --fg:#dfe9ed; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
    background: var(--bg, #fbfaf6); color: var(--fg, #162126);
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "Microsoft JhengHei", serif; }
  .card { width: min(100%, 560px); border: 1px solid currentColor; padding: 40px; opacity: .9; }
  .eyebrow { margin: 0 0 22px; font: 11px/1.4 Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  h1 { margin: 0 0 16px; font-size: clamp(2.4rem, 8vw, 4.2rem); font-weight: 300; line-height: 1.15; }
  p { max-width: 390px; margin: 0 0 26px; font-size: 17px; line-height: 1.8; opacity: .7; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">訊號遺失 / 離線</p>
    <h1>你離線了。</h1>
    <p>訊號回來時，頁面會在這裡。海很耐心。</p>
    <a href="/zh/">再試一次</a>
  </div>
</body>
</html>
